<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>East Fork Lead Radar</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--hot:#b91c1c;--warm:#a16207}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header{background:#111827;color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{color:#cbd5e1;font-size:13px}
.toolbar{padding:12px;display:flex;gap:8px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:78px;z-index:4}
button,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;white-space:nowrap;text-decoration:none;color:var(--ink)}
button.active{background:#111827;color:#fff}.wrap{max-width:720px;margin:auto;padding:12px}.count{font-size:13px;color:var(--muted);margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #00000008}
.top{display:flex;justify-content:space-between;gap:10px}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}.HOT{background:#fee2e2;color:var(--hot)}.WARM{background:#fef3c7;color:var(--warm)}.WATCH{background:#e5e7eb;color:#374151}
h2{font-size:17px;margin:0 0 3px}.company{font-weight:700}.muted{color:var(--muted);font-size:13px}.scope{margin:12px 0;line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.cell{background:#f9fafb;border-radius:10px;padding:9px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1;text-align:center}.reason{margin-top:11px;padding:10px;border-left:3px solid #111827;background:#f9fafb;font-size:13px}
#search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
footer{padding:24px 12px 40px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><h1>East Fork Lead Radar</h1><div class="sub">DFW commercial & industrial service opportunities</div></header>
<div class="toolbar"><button class="active" data-filter="ALL">All</button><button data-filter="HOT">🔥 HOT</button><button data-filter="WARM">WARM</button><button data-filter="WATCH">WATCH</button></div>
<main class="wrap">
<input id="search" placeholder="Search company, city, project or scope…">
<div class="count" id="count"></div>
<div id="list"></div>
</main>
<footer>Lead radar • No CRM • Built for quick follow-up</footer>
<script>
let leads=[],filter="ALL";
const $=id=>document.getElementById(id);
async function load(){leads=await (await fetch("leads.json")).json(); render();}
function render(){
 const q=$("search").value.toLowerCase();
 const rows=leads.filter(x=>(filter==="ALL"||x.priority===filter)&&
   JSON.stringify(x).toLowerCase().includes(q));
 $("count").textContent=`${rows.length} opportunity${rows.length===1?"":"ies"} • updated dataset`;
 $("list").innerHTML=rows.length?rows.map(card).join(""):`<div class="empty">No matching opportunities.</div>`;
}
function card(x){
 const tel=x.phone?`<a class="btn" href="tel:${x.phone.replace(/[^0-9+]/g,"")}">📞 Call</a>`:"";
 const mail=x.email?`<a class="btn" href="mailto:${x.email}">✉️ Email</a>`:"";
 const site=x.website?`<a class="btn" href="${x.website}" target="_blank" rel="noopener">🌐 Website</a>`:"";
 return `<article class="card"><div class="top"><div><h2>${x.project}</h2><div class="company">${x.company}</div><div class="muted">${x.city} • Discovered ${x.discovered}</div></div><span class="badge ${x.priority}">${x.priority}</span></div>
 <div class="scope"><b>${x.type}</b><br>${x.scope}</div>
 <div class="grid"><div class="cell"><div class="label">Contact</div>${x.contact}<br><span class="muted">${x.title}</span></div>
 <div class="cell"><div class="label">Phone</div>${x.phone||"Not found"}</div>
 <div class="cell"><div class="label">Address</div>${x.address}</div><div class="cell"><div class="label">Timing</div>${x.timing}</div></div>
 <div class="reason"><b>Why call:</b> ${x.reason}</div>
 <div class="actions">${tel}${mail}${site}</div></article>`;
}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(z=>z.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
$("search").oninput=render; load();
</script>
</body></html>
